<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Shopping List</title>
<style>
  :root{
    --green:#143c2b; --green-2:#1c5138; --green-txt:#20573d;
    --gold:#c08a2a; --gold-txt:#8a6516; --gold-bg:#fdf3dc; --gold-br:#e8c97a;
    --cream:#f2f1ea; --card:#fff; --line:#e7e5db; --line-2:#d9d7cb;
    --mute:#7b7b72; --red:#c0503c; --red-br:#e3b4aa; --chip-bg:#eaf2ec;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream);color:#1e1e1a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;-webkit-font-smoothing:antialiased;padding-bottom:120px;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  input,select{font:inherit}

  .tabs{position:sticky;top:0;z-index:40;background:var(--green);display:flex;gap:4px;padding:0 14px}
  .tab{background:none;border:0;padding:16px 12px 13px;color:#a9c3b4;font-weight:700;font-size:17px;
       display:flex;align-items:center;gap:9px;border-bottom:3px solid transparent}
  .tab.on{color:#fff;border-bottom-color:var(--gold)}
  .tab .n{background:rgba(255,255,255,.14);color:#dcebe2;border-radius:999px;min-width:26px;padding:2px 8px;font-size:13px;text-align:center}
  .tab.on .n{background:var(--gold);color:#2a1d02}

  .wrap{max-width:1040px;margin:0 auto;padding:16px 14px 20px}
  .titlebar{background:#fbfaf4;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .titlebar input{border:0;background:none;width:100%;font-size:22px;font-weight:700;color:#1e1e1a}
  .titlebar input:focus{outline:none}
  .search{display:flex;align-items:center;gap:10px;background:#fbfaf4;border:1px solid var(--line);
          border-radius:var(--radius);padding:14px 18px;margin-bottom:14px}
  .search svg{flex:none;opacity:.45}
  .search input{border:0;background:none;width:100%;font-size:17px}
  .search input:focus{outline:none}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .btn{background:#fbfaf4;border:1px solid var(--line-2);border-radius:12px;padding:11px 16px;font-weight:600}
  .btn:hover{background:#fff}
  .btn-solid{background:var(--green);border-color:var(--green);color:#fff}
  .btn-solid:hover{background:var(--green-2)}
  .btn-danger{color:var(--red);border-color:var(--red-br);background:#fff}
  .btn-danger:hover{background:#fdf4f2}

  .aisle{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
  .aisle-head{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;background:none;border:0;text-align:left}
  .caret{color:#4a4a42;font-size:12px;width:12px;transition:transform .15s}
  .aisle.collapsed .caret{transform:rotate(-90deg)}
  .badge{flex:none;width:40px;height:40px;border-radius:11px;background:var(--green);color:#fff;
         display:grid;place-items:center;font-weight:700;font-size:16px}
  .aisle-name{font-size:19px;font-weight:700;flex:1}
  .pill{background:#f4f3ec;border:1px solid var(--line);color:var(--mute);border-radius:999px;
        padding:6px 14px;font-size:14px;white-space:nowrap}
  .pill.hot{background:var(--gold-bg);border-color:var(--gold-br);color:var(--gold-txt);font-weight:700}
  .aisle.collapsed .aisle-body{display:none}

  .subhead{display:flex;align-items:center;gap:12px;padding:11px 18px;background:#f6f8f6;
           border-top:1px solid var(--line);font-size:14px;font-weight:700;color:var(--green-txt)}
  .subhead .ln{flex:1;height:1px;background:#dde5df}
  .subhead .r{flex:none;color:#8e9a92;font-weight:600;font-size:13px}
  .subhead .add{flex:none;background:#fff;border:1px solid #cfdcd4;border-radius:9px;
                padding:5px 11px;font-size:13px;font-weight:700;color:var(--green-txt)}
  .subhead .add:hover{background:#eef5f0}

  .results{}
  .crumb{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:3px}
  .subhead.sticky{position:sticky;top:56px;z-index:20}
  .more{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);
        background:#fbfaf4;font-size:15px;color:var(--mute)}
  .more .btn{margin-left:auto}
  .row{display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--line)}
  .row.on{background:#f7fbf8}
  .row.bought{background:#f6f5ef}
  .row.bought .row-name{text-decoration:line-through;color:var(--mute)}
  .tick{flex:none;width:30px;height:30px;border-radius:9px;border:1.5px solid #cfd4ce;background:#fff;
        display:grid;place-items:center;padding:0;color:transparent;font-size:16px}
  .row.on .tick{border-color:var(--green);background:var(--green);color:#fff}
  .row-main{flex:1;min-width:0}
  .row-name{font-size:18px;font-weight:700;margin-bottom:7px;line-height:1.25}
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:6px 11px;font-size:14px;font-weight:600}
  .chip.qty{background:var(--chip-bg);border-color:#d5e3d9;color:var(--green-txt)}
  .store{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;
         border-radius:10px;padding:5px 10px;font-size:14px;font-weight:700;color:var(--green-txt)}
  .store:hover{background:#f2f7f3;border-color:#a9c9b6}
  .store.empty{border-style:dashed;color:#9a9a91;font-weight:600}
  .store .code{background:var(--chip-bg);border-radius:6px;padding:2px 7px}
  .store .code .a{color:var(--gold-txt);margin-left:5px}
  .store .lab{font-size:12px;font-weight:700;color:#9a9a91;letter-spacing:.04em;margin-right:2px}
  .stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:#fff}
  .stepper .lab{padding:6px 10px;font-size:12px;font-weight:700;color:#9a9a91;letter-spacing:.04em}
  .stepper button{background:none;border:0;border-left:1px solid var(--line-2);padding:6px 12px;
                  color:var(--green-txt);font-weight:700;font-size:17px;line-height:1.1}
  .stepper .val{border-left:1px solid var(--line-2);padding:6px 13px;font-weight:700;min-width:38px;text-align:center}
  .stepper button:hover{background:#f2f7f3}
  .row-acts{display:flex;gap:10px;flex:none}
  .sq{width:46px;height:46px;border-radius:11px;background:#fff;border:1px solid var(--line-2);
      display:grid;place-items:center;font-size:18px}
  .sq.ok:hover{background:#f2f7f3;border-color:#a9c9b6}
  .sq.no{color:var(--red);border-color:var(--red-br)}
  .sq.no:hover{background:#fdf4f2}
  .aisle-foot{display:flex;flex-wrap:wrap;gap:12px;padding:16px 18px;border-top:1px solid var(--line)}
  .empty{padding:18px;color:var(--mute);border-top:1px solid var(--line)}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(246,245,238,.96);
       border-top:1px solid var(--line);backdrop-filter:blur(6px);display:flex;align-items:center;
       justify-content:space-between;gap:14px;padding:12px 18px}
  .bar .status{font-size:15px;color:#5c5c54}
  .bar .status b{color:var(--gold-txt)}
  .bar .save{background:var(--gold);border:0;color:#fff;font-weight:700;font-size:17px;padding:15px 26px;border-radius:12px}
  .bar .save:disabled{background:#d6d3c6;color:#8d8a80;cursor:default}

  .scrim{position:fixed;inset:0;z-index:60;background:rgba(20,30,25,.45);display:grid;place-items:center;padding:18px}
  .modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:#fff;border-radius:16px;
         box-shadow:0 24px 60px rgba(0,0,0,.28)}
  .modal h2{margin:0;background:var(--green);color:#fff;padding:20px 24px;font-size:21px;position:sticky;top:0}
  .modal .body{padding:22px 24px 8px}
  .modal label{display:block;font-weight:700;margin-bottom:8px}
  .modal label span{color:var(--mute);font-weight:500}
  .modal input{width:100%;padding:14px 16px;margin-bottom:20px;font-size:17px;
               border:1px solid var(--line-2);border-radius:12px;background:#fbfaf4}
  .modal input:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(20,60,43,.09)}
  .modal .acts{display:flex;gap:14px;padding:6px 24px 24px}
  .modal .acts .btn{flex:1;padding:15px;text-align:center;border-radius:12px;font-size:17px}
  .modal .acts .go{background:var(--green);border-color:var(--green);color:#fff}
  .shead{display:grid;grid-template-columns:112px 1fr 48px;gap:10px;font-size:13px;color:var(--mute);font-weight:700;margin-bottom:8px}
  .srow{display:grid;grid-template-columns:112px 1fr 48px;gap:10px;margin-bottom:12px}
  .srow input{margin-bottom:0}
  .srow .x{border:1px solid var(--red-br);color:var(--red);background:#fff;border-radius:12px}
  .srow .x:hover{background:#fdf4f2}
  .addstore{width:100%;border:1px dashed var(--line-2);background:#fbfaf4;border-radius:12px;
            padding:13px;font-weight:700;color:var(--green-txt);margin:4px 0 14px}
  .hint{color:var(--mute);font-size:14px;margin:0 0 16px}

  .banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff;
           border:1px solid var(--line);border-left:4px solid var(--gold);
           border-radius:var(--radius);padding:13px 18px;margin-bottom:14px;font-size:15px}
  .banner .who{font-weight:700}
  .banner .lnk{background:none;border:0;padding:0;color:var(--green-txt);font-weight:700;text-decoration:underline}
  .banner .sync{margin-left:auto;color:var(--mute);font-size:14px}
  .by{background:#f4f3ec;border:1px solid var(--line);color:var(--mute);
      border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;margin-left:8px;
      vertical-align:middle;white-space:nowrap}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:#fff}
  .btn-gold:hover{background:#b07d22}
  #toasts{position:fixed;right:14px;bottom:86px;z-index:70;display:flex;flex-direction:column;gap:10px;
          max-width:min(340px,calc(100vw - 28px))}
  .toast{background:var(--green);color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;
         display:flex;gap:10px;align-items:flex-start;box-shadow:0 8px 24px rgba(0,0,0,.22)}
  .toast.del{background:#8f3a2b}
  .toast .x{background:none;border:0;color:#cfe0d6;font-size:16px;line-height:1;padding:0 0 0 4px}
  .toast b{font-weight:700}
  .act{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
  .act summary{padding:13px 18px;font-weight:600;cursor:pointer}
  .act ul{margin:0;padding:0 18px 14px;list-style:none;border-top:1px solid var(--line);padding-top:12px}
  .act li{font-size:15px;color:#3d3d36;margin-bottom:7px;display:flex;gap:8px}
  .act li .w{color:var(--mute);font-size:13px;margin-left:auto;white-space:nowrap}
  .act .dot{color:var(--green-txt);font-weight:700}
  .act .dot.d{color:var(--red)}
  .note{color:var(--mute);padding:28px 4px;text-align:center}
  .hist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
  .hist-head{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;background:none;border:0;text-align:left}
  .hist-head .t{flex:1;font-weight:700;font-size:18px}
  .hist ul{margin:0;padding:14px 18px 16px 46px;border-top:1px solid var(--line)}
  .hist li{margin:0 0 7px;color:#3d3d36}
  .legend{background:#fbfaf4;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
  .legend summary{padding:13px 18px;font-weight:600;cursor:pointer}
  .legend .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 18px;
                padding:4px 18px 18px;font-size:15px;color:#4a4a42}
  .legend code{background:var(--chip-bg);color:var(--green-txt);border-radius:6px;padding:2px 7px;font-weight:700;margin-right:8px}
  .reflist{border-top:1px solid var(--line)}
  .refrow{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid #efeee6}
  .refrow .cat{flex:1;background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:16px;color:var(--green)}
  .refrow .cat:hover{text-decoration:underline}
  .refrow .c{font-size:13px;font-weight:600;color:var(--mute)}
  .refrow .exp{flex:none;width:34px;height:34px;border:1px solid var(--line-2);background:#fff;
               border-radius:9px;font-size:12px;color:#4a4a42}
  .refrow .exp:hover{background:#f2f7f3}
  .refrow .del{color:var(--red);border-color:var(--red-br)}
  .refrow .del:hover{background:#fdf4f2}
  .refrow.act{background:var(--chip-bg)}
  .refsubs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px 12px 18px;background:#fafaf5;
           border-bottom:1px solid #efeee6}
  .refsubs .sub{background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;
                font-size:14px;font-weight:600;color:#4a4a42}
  .refsubs .sub:hover{background:var(--chip-bg);border-color:#a9c9b6;color:var(--green-txt)}
  .refsubs .sub.act{background:var(--green);border-color:var(--green);color:#fff}
  .focusbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--gold-bg);
            border:1px solid var(--gold-br);border-radius:var(--radius);padding:12px 18px;margin-bottom:14px}
  .focusbar .t{font-weight:700;color:var(--gold-txt)}
  .focusbar .btn{padding:8px 14px}
  .focusbar .btn:first-of-type{margin-left:auto}

  .toolbar .rhs{margin-left:auto}
  .toolbar .rhs,.toolbar .rhs2{min-width:186px;text-align:center;padding:11px 16px}
  .toolbar .btn-solid{background:#143c2b;border-color:#143c2b;color:#fff}
  .toolbar .btn-solid:hover{background:#1c5138}
  .toolbar .btn-black{background:#141414;border-color:#141414;color:#fff}
  .toolbar .btn-black:hover{background:#2b2b2b}
  .toolbar .btn-black.on{background:#c0503c;border-color:#c0503c;color:#fff}
  .toolbar .btn-black.on:hover{background:#a8422f}
  .toolbar .btn-solid.act{background:#c0503c;border-color:#c0503c;color:#fff}
  .toolbar .btn-solid.act:hover{background:#a8422f}
  .viewtabs{display:flex;gap:10px;margin-bottom:14px}
  .viewtabs .btn{flex:1;text-align:center}
  .viewtabs .btn.on{background:var(--green);border-color:var(--green);color:#fff}
  @media (max-width:640px){
    .toolbar .rhs{margin-left:0}
    .toolbar .rhs,.toolbar .rhs2{flex:1 1 46%;min-width:0}
  }
  @media (max-width:640px){
    .row{flex-wrap:wrap}
    .row-acts{margin-left:44px}
    .row-name{font-size:17px}
    .wrap{padding:12px 10px 16px}
    .aisle-head,.row,.subhead{padding-left:14px;padding-right:14px}
    .subhead{flex-wrap:wrap}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>

function stamp(){ return new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }

function fmtDate(d){
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], p=n=>String(n).padStart(2,'0');
  return `${days[d.getDay()]} ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sortkey = s => String(s).toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
const cmp = (a,b) => sortkey(a).localeCompare(sortkey(b));
const allProducts = () => S.aisles.flatMap(a=>a.products);
const onListCount = () => allProducts().filter(p=>p.onList).length;

function sortAisle(a){ a.products.sort((x,y)=>cmp(x.sub,y.sub)||cmp(x.name,y.name)); }

function badgeFor(n){ const m=n.match(/^Aisle\s+(\d+)/i); return m?m[1]:n.trim().charAt(0).toUpperCase(); }
function subsOf(a){ return [...new Set(a.products.map(p=>p.sub))].sort(cmp); }
function storeText(p){ return p.stores.map(s=>s.code+(s.aisle?' '+s.aisle:'')).join(' · '); }
function matches(p,q){ return !q || (p.name+' '+p.sub+' '+storeText(p)).toLowerCase().includes(q); }
function groupBySub(ps){
  const g=[], idx={};
  ps.forEach(p=>{ if(!(p.sub in idx)){ idx[p.sub]=g.length; g.push({sub:p.sub,items:[]}); } g[idx[p.sub]].items.push(p); });
  g.sort((a,b)=>cmp(a.sub,b.sub));
  g.forEach(x=>x.items.sort((a,b)=>cmp(a.name,b.name)));
  return g;
}
let seenAt = 0;

function logEvent(kind, name, where){
  S.log.unshift({k:kind, n:name, w:where||'', by:ME||'Someone', t:Date.now()});
  S.log = S.log.slice(0, 40);
  seenAt = S.log[0].t;
}

function ago(t){
  const m = Math.round((Date.now()-t)/60000);
  if(m < 1) return 'just now';
  if(m < 60) return m+' min ago';
  const h = Math.round(m/60);
  return h < 24 ? h+' h ago' : Math.round(h/24)+' d ago';
}

function toast(ev){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast'+(ev.k==='del'?' del':'');
  el.innerHTML = `<span><b>${esc(ev.by)}</b> ${ev.k==='del'?'deleted':'added'} ${esc(ev.n)}${ev.w?' \u00b7 '+esc(ev.w):''}</span>
    <button class="x" aria-label="Dismiss">\u2715</button>`;
  el.querySelector('.x').onclick = ()=>el.remove();
  box.appendChild(el);
  setTimeout(()=>el.remove(), 9000);
}

function activityPanel(){
  if(!S.log.length) return '';
  return `<details class="act"><summary>Recent activity (${S.log.length})</summary><ul>${
    S.log.slice(0,12).map(e=>`<li><span class="dot ${e.k==='del'?'d':''}">${e.k==='del'?'\u2212':'+'}</span>
      <span><b>${esc(e.by)}</b> ${e.k==='del'?'deleted':'added'} ${esc(e.n)}${e.w?' \u00b7 '+esc(e.w):''}</span>
      <span class="w">${ago(e.t)}</span></li>`).join('')}</ul></details>`;
}

function save(){
  if(!SB){ setSync('Offline \u2014 not connected'); return; }
  clearTimeout(writeTimer);
  writeTimer = setTimeout(async ()=>{
    REV++;
    try{
      const { error } = await SB.from('house_list').upsert({
        id: ROW_ID, rev: REV, updated_by: ME || 'Someone',
        data: { title:S.title, aisles:S.aisles, history:S.history, log:S.log }
      });
      if(error) throw error;
      setSync('Saved '+stamp());
    }catch(e){
      setSync('Save failed \u2014 retrying');
      setTimeout(save, 3000);
    }
  }, 500);
}

function applyRemote(row){
  if(!row || (row.rev||0) <= REV) return;
  if(document.getElementById('modalHost').innerHTML) return;
  const d = row.data || {};
  if(!d.aisles || !d.aisles.length) return;
  REV = row.rev;
  S.title = d.title || S.title; S.aisles = d.aisles; S.history = d.history || [];
  const fresh = (d.log||[]).filter(e=>e.t>seenAt && e.by!==ME);
  S.log = d.log || [];
  if(S.log.length) seenAt = Math.max(seenAt, S.log[0].t);
  normalise(); render();
  fresh.slice(0,4).reverse().forEach(toast);
  if(fresh.length>4) toast({by:'', k:'add', n:(fresh.length-4)+' more changes', w:''});
  setSync('Updated by '+(row.updated_by||'someone')+' \u00b7 '+stamp());
}

async function pull(){
  if(!SB || syncing || document.getElementById('modalHost').innerHTML) return;
  syncing = true;
  try{
    const { data, error } = await SB.from('house_list')
      .select('rev,data,updated_by').eq('id', ROW_ID).maybeSingle();
    if(!error) applyRemote(data);
  }catch(e){}
  syncing = false;
}

function normalise(){
  S.aisles.forEach(a=>{
    a.products.forEach(p=>{
      if(!p.sub) p.sub='Other';
      if(!Array.isArray(p.stores))
        p.stores=(p.info||'').split('/').filter(Boolean).map(c=>({code:c,aisle:''}));
      delete p.info; delete p.star; delete p.stock; delete p.editStock;
    });
    sortAisle(a);
  });
  sortAisles();
}

function storeBtn(p){
  if(!p.stores.length)
    return `<button class="store empty" data-act="stores" data-p="${p.id}">+ Add store</button>`;
  return `<button class="store" data-act="stores" data-p="${p.id}">${
    p.stores.map(s=>`<span class="code">${esc(s.code)}</span>`).join('')
  }</button>`;
}

function aisleBtn(p){
  const set = p.stores.filter(s=>s.aisle);
  if(!set.length)
    return `<button class="store empty" data-act="stores" data-p="${p.id}">+ Add aisle</button>`;
  return `<button class="store" data-act="stores" data-p="${p.id}"><span class="lab">AISLE</span>${
    set.map(s=>`<span class="code">${esc(s.code)}<span class="a">${esc(s.aisle)}</span></span>`).join('')
  }</button>`;
}

function productRow(p, crumb){
  return `<div class="row ${p.onList?'on':''} ${p.bought?'bought':''}">
    <button class="tick" data-act="toggle" data-p="${p.id}" aria-label="Add to list">\u2713</button>
    <div class="row-main">
      ${crumb?`<div class="crumb">${esc(crumb)}</div>`:''}
      <div class="row-name">${esc(p.name)}${p.by&&p.by!==ME?`<span class="by">added by ${esc(p.by)}</span>`:''}</div>
      <div class="chips">
        ${p.qty?`<span class="chip qty">${esc(p.qty)}</span>`:''}
        <span class="stepper"><span class="lab">BUY</span><button data-act="buy-" data-p="${p.id}">\u2212</button><span class="val">${p.buy}</span><button data-act="buy+" data-p="${p.id}">+</button></span>
        ${storeBtn(p)}
        ${aisleBtn(p)}
      </div>
    </div>
    <div class="row-acts">
      <button class="sq ok" data-act="bought" data-p="${p.id}" title="Mark purchased">\u2713</button>
      <button class="sq no" data-act="del" data-p="${p.id}" title="Delete item">\u2715</button>
    </div>
  </div>`;
}

function subhead(a,g){
  const n=g.items.filter(p=>p.onList).length;
  return `<div class="subhead sticky" id="sub-${a.id}-${slug(g.sub)}">
    <span>${esc(g.sub)}</span><span class="ln"></span>
    <span class="r">${n?n+' of ':''}${g.items.length}</span>
    <button class="add" data-act="additem" data-a="${a.id}" data-sub="${esc(g.sub)}">+ Add item</button>
  </div>`;
}

function renderTabs(){
  const t=[['list','List',onListCount()],['shop','Shop',onListCount()-boughtCount()],['history','History',S.history.length]];
  document.getElementById('tabs').innerHTML = t.map(([k,l,n])=>
    `<button class="tab ${S.tab===k?'on':''}" data-tab="${k}">${l}<span class="n">${n}</span></button>`).join('');
}

const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

function allBar(){
  if(!S.allItems) return '';
  const n=allProducts().length;
  return `<div class="focusbar">
    <span class="t">All items</span>
    <span>${S.aisles.length} categories \u00b7 ${n} items</span>
    <button class="btn" data-act="allitems">\u2715 Close all items</button>
  </div>`;
}

function focusBar(){
  if(!S.focus) return '';
  const a=S.aisles.find(x=>x.id===S.focus.a);
  if(!a){ S.focus=null; return ''; }
  const n=S.focus.sub ? a.products.filter(p=>p.sub===S.focus.sub).length : a.products.length;
  return `<div class="focusbar">
    <span class="t">${esc(a.name)}${S.focus.sub?' · '+esc(S.focus.sub):''}</span>
    <span>${n} item${n===1?'':'s'}</span>
    <button class="btn" data-act="clearfocus">\u2190 All categories</button>
  </div>`;
}

function quickRef(){
  const shut = !S.catsOpen;
  return `<section class="aisle">
    <div class="aisle-head">
      <span class="caret" style="${shut?'transform:rotate(-90deg)':''}">\u25be</span>
      <span class="aisle-name">Categories</span>
      <span class="pill">${S.aisles.length} categories \u00b7 ${allProducts().length} items</span>
      <button class="exp ${shut?'':'del'}" data-act="allcats" title="${shut?'Open categories':'Close categories'}" style="margin-left:10px">${shut?'\u25b8':'\u2715'}</button>
    </div>
    ${shut?'':`<div class="reflist">${S.aisles.map(a=>{
      const open = !!S.refCats[a.id];
      return `<div class="refrow">
          <button class="exp" data-act="refexp" data-a="${a.id}">${open?'\u25be':'\u25b8'}</button>
          <button class="cat" data-act="jump" data-cat="${a.id}">${esc(a.name)}</button>
          <span class="c">${a.products.length}</span>
          <button class="exp del" data-act="delaisle" data-a="${a.id}" title="Delete category">\u2715</button>
        </div>
        ${open?`<div class="refsubs">${subsOf(a).map(x=>
          `<button class="sub" data-act="jump" data-a="${a.id}" data-sub="${esc(x)}">${esc(x)}</button>`
        ).join('')}</div>`:''}`;

    <div class="aisle-foot">
      <button class="btn btn-solid" data-act="addaisle">+ Add category</button>

function searchPanel(q){
  const hits=[];
  S.aisles.forEach(a=>a.products.filter(p=>matches(p,q)).forEach(p=>hits.push({a,p})));
  hits.sort((x,y)=>cmp(x.p.name,y.p.name)||cmp(x.a.name,y.a.name));
  if(!hits.length) return '<p class="note">Nothing matches that search.</p>';
  const shown=hits.slice(0, S.limit);
  return `<section class="aisle">
    <div class="aisle-head">
      <span class="badge">\u2315</span>
      <span class="aisle-name">Search results</span>
      <span class="pill hot">${hits.length} found</span>
    </div>
    <div class="results">${shown.map(h=>productRow(h.p, h.a.name+' \u00b7 '+h.p.sub)).join('')}</div>
    ${hits.length>shown.length?`<div class="more">
      <span>Showing ${shown.length} of ${hits.length}</span>
      <button class="btn" data-act="more">Show 50 more</button>
    </div>`:`<div class="more"><span>All ${hits.length} shown</span></div>`}
  </section>`;
}

function renderList(){
  const q=S.query.trim().toLowerCase();
  const F = q ? null : S.focus;
  const body = q ? searchPanel(q)
    : (!F && !S.allItems ? quickRef() : S.aisles.map(a=>{
    if(F && F.a!==a.id) return '';
    if(!a.products.length) return `<section class="aisle"><div class="aisle-head">
        <span class="badge">${esc(badgeFor(a.name))}</span><span class="aisle-name">${esc(a.name)}</span>
        <span class="pill">empty</span></div>
      <div class="aisle-foot">
        <button class="btn" data-act="additem" data-a="${a.id}">+ Add item</button>
        <button class="btn btn-danger" data-act="delaisle" data-a="${a.id}">Delete category</button>
      </div></section>`;
    let ps=a.products.filter(p=>matches(p,q));
    if(F && F.sub) ps=ps.filter(p=>p.sub===F.sub);
    if(!ps.length) return '';
    if(q && !ps.length) return '';
    const n=a.products.filter(p=>p.onList).length;
    return `<section class="aisle ${a.collapsed&&!q?'collapsed':''}" id="cat-${a.id}">
      <button class="aisle-head" data-act="fold" data-a="${a.id}">
        <span class="caret">▼</span><span class="badge">${esc(badgeFor(a.name))}</span>
        <span class="aisle-name">${esc(a.name)}</span>
        <span class="pill ${n?'hot':''}">${n} on list</span>
      </button>
      <div class="aisle-body">
        ${ps.length?groupBySub(ps).map(g=>subhead(a,g)+g.items.map(productRow).join('')).join('')
                   :'<p class="empty">No products yet.</p>'}
        <div class="aisle-foot">
          <button class="btn" data-act="additem" data-a="${a.id}">+ Add item</button>
          <button class="btn" data-act="addsub" data-a="${a.id}">+ Add sub-category</button>
          <button class="btn btn-danger" data-act="delaisle" data-a="${a.id}">Delete category</button>
        </div>
      </div>
    </section>`;
  }).join(''));

  document.getElementById('view').innerHTML = `
    <div class="titlebar"><input id="title" value="${esc(S.title)}"></div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search items, sub-categories or store codes…" value="${esc(S.query)}">
    </div>
    <div class="banner">
      <span>Shared list — everyone invited sees the same one.</span>
      <span class="who">You are ${esc(ME||'Guest')}</span>
      <button class="lnk" data-act="rename">change</button>
      <span class="sync" id="sync">${esc(SYNC)}</span>
    </div>
    <div class="toolbar">
      <button class="btn btn-gold" data-act="quickadd">+ Quick add to list</button>
      <button class="btn" data-act="clear">Clear selections</button>
      <button class="btn btn-black rhs ${S.catsOpen&&!S.allItems&&!S.focus?'on':''}" data-act="allcats">${S.catsOpen&&!S.allItems&&!S.focus?'\u2715 Close categories':'All categories'}</button>
      <button class="btn btn-solid rhs2 ${S.allItems?'act':''}" data-act="allitems">${S.allItems?'\u2715 Close all items':'All items'}</button>
    </div>
    ${q?'':activityPanel()}
    ${q?'':allBar()}
    ${q?'':focusBar()}
    <details class="legend"><summary>Store codes</summary><div class="grid">${
      DATA.stores.map(s=>`<div><code>${esc(s.code)}</code>${esc(s.name)}</div>`).join('')}</div></details>
    ${body}`;
}

function shopRow(p, note){
  return `<div class="row ${p.bought?'bought':''}">
    <button class="tick" data-act="bought" data-p="${p.id}" style="${p.bought?'border-color:var(--green);background:var(--green);color:#fff':''}">\u2713</button>
    <div class="row-main">
      ${note?`<div class="crumb">${esc(note)}</div>`:''}
      <div class="row-name">${esc(p.name)}${p.wantedBy&&p.wantedBy!==ME?`<span class="by">${esc(p.wantedBy)}</span>`:''}</div>
      <div class="chips">
        ${p.qty?`<span class="chip qty">${esc(p.qty)}</span>`:''}
        <span class="chip qty">Buy ${p.buy}</span>
        ${storeBtn(p)}
        ${aisleBtn(p)}
      </div>
    </div>
    <div class="row-acts"><button class="sq no" data-act="toggle" data-p="${p.id}" title="Take off list">\u2715</button></div>
  </div>`;
}

function shopToggle(){
  return `<div class="viewtabs">
    <button class="btn ${S.shopView==='az'?'on':''}" data-act="shopview" data-v="az">A\u2013Z list</button>
    <button class="btn ${S.shopView==='store'?'on':''}" data-act="shopview" data-v="store">By store</button>
  </div>`;
}

function shopAZ(){
  const items=[];
  S.aisles.forEach(a=>a.products.filter(p=>p.onList).forEach(p=>items.push({a,p})));
  items.sort((x,y)=>cmp(x.p.name,y.p.name));
  return `<section class="aisle">
    <div class="aisle-head">
      <span class="aisle-name">Everything on the list</span>
      <span class="pill hot">${items.filter(x=>x.p.bought).length}/${items.length}</span>
    </div>
    <div>${items.map(x=>shopRow(x.p, x.a.name+' \u00b7 '+x.p.sub)).join('')}</div>
  </section>`;
}

function aisleKey(v){
  const n=parseInt(v,10);
  return isNaN(n) ? 'zzz'+sortkey(v) : String(n).padStart(4,'0');
}

function shopByStore(){
  const names=Object.fromEntries(DATA.stores.map(s=>[s.code,s.name]));
  const groups={}, none=[];
  S.aisles.forEach(a=>a.products.filter(p=>p.onList).forEach(p=>{
    if(!p.stores.length){ none.push({a,p,aisle:''}); return; }
    p.stores.forEach(st=>{
      (groups[st.code] = groups[st.code] || []).push({a,p,aisle:st.aisle});
    });
  }));
  const codes=Object.keys(groups).sort(cmp);
  const block=(code,list)=>{
    list.sort((x,y)=>aisleKey(x.aisle).localeCompare(aisleKey(y.aisle))||cmp(x.p.name,y.p.name));
    return `<section class="aisle">
      <div class="aisle-head">
        <span class="badge">${esc(code.slice(0,3))}</span>
        <span class="aisle-name">${esc(names[code]||code)}</span>
        <span class="pill hot">${list.filter(x=>x.p.bought).length}/${list.length}</span>
      </div>
      <div>${list.map(x=>shopRow(x.p, x.aisle?('Aisle '+x.aisle):x.a.name)).join('')}</div>
    </section>`;
  };
  return codes.map(c=>block(c,groups[c])).join('') +
    (none.length?`<section class="aisle">
      <div class="aisle-head"><span class="badge">?</span>
        <span class="aisle-name">No store set</span>
        <span class="pill">${none.length}</span></div>
      <div>${none.map(x=>shopRow(x.p, x.a.name+' \u00b7 '+x.p.sub)).join('')}</div>
    </section>`:'');
}

function renderShop(){
  const n=onListCount();
  document.getElementById('view').innerHTML = n
    ? shopToggle() + (S.shopView==='store' ? shopByStore() : shopAZ())
    : '<p class="note">Nothing on the list yet. Tick items on the List tab.</p>';
}

function renderHistory(){
  const h=S.history;
  document.getElementById('view').innerHTML = h.length ? h.map((x,i)=>`
    <section class="hist">
      <button class="hist-head" data-act="fold-h" data-i="${i}">
        <span class="caret" style="${x.open?'':'transform:rotate(-90deg)'}">▼</span>

      </button>
      ${x.open?`<ul>${x.items.map(it=>`<li>${esc(it.name)}${it.buy>1?' × '+it.buy:''}${it.stores?' · '+esc(it.stores):''}${it.bought?' ✓':''}</li>`).join('')}</ul>`:''}
    </section>`).join('') : '<p class="note">No shops saved yet.</p>';
}

function renderBar(){
  const bar=document.getElementById('bar');
  if(S.tab==='history'){ bar.hidden=true; return; }
  bar.hidden=false;
  const n=onListCount(), b=boughtCount();
  bar.innerHTML = `<span class="status">${S.dirty?'<b>Unsaved changes</b> · ':''}${n} on list, ${b} purchased</span>

function render(){
  const y=window.scrollY;
  renderTabs();
  S.tab==='list'?renderList():S.tab==='shop'?renderShop():renderHistory();
  renderBar();
  window.scrollTo(0,y);

/* ---------- modals ---------- */
const host = () => document.getElementById('modalHost');
const closeModal = () => { host().innerHTML=''; };

function modal(title, fields, onOk, okLabel){
  host().innerHTML = `<div class="scrim"><div class="modal">
    <h2>${esc(title)}</h2>
    <div class="body">${fields.map((f,i)=>
      `<label>${esc(f.label)} ${f.opt?'<span>(optional)</span>':''}</label>
       <input id="f${i}" placeholder="${esc(f.ph||'')}" value="${esc(f.val||'')}" ${f.list?'list="storecodes"':''}>`).join('')}</div>
    <div class="acts">
      <button class="btn" data-m="cancel">Cancel</button>
      <button class="btn go" data-m="ok">${esc(okLabel||'Add')}</button>
    </div></div></div>`;
  host().querySelector('#f0').focus();
  host().onclick = e=>{
    if(e.target.classList.contains('scrim')||e.target.dataset.m==='cancel') return closeModal();
    if(e.target.dataset.m==='ok'){
      const vals=fields.map((f,i)=>host().querySelector('#f'+i).value.trim());
      if(!vals[0]) return host().querySelector('#f0').focus();
      closeModal(); onOk(vals);
    }
  };
  host().onkeydown = e=>{
    if(e.key==='Escape') closeModal();
    if(e.key==='Enter') host().querySelector('[data-m="ok"]').click();
  };
}

function storeModal(p){
  let rows = p.stores.length ? p.stores.map(s=>({...s})) : [{code:'',aisle:''}];
  const draw = ()=>{
    host().innerHTML = `<div class="scrim"><div class="modal">
      <h2>Stores &amp; aisles · ${esc(p.name)}</h2>
      <div class="body">
        <div class="shead"><span>Store code</span><span>Aisle at that store</span><span></span></div>
        ${rows.map((r,i)=>`<div class="srow">
          <input data-i="${i}" data-k="code" list="storecodes" placeholder="CO" value="${esc(r.code)}" maxlength="4">
          <input data-i="${i}" data-k="aisle" placeholder="e.g. 7, Fridge, Deli" value="${esc(r.aisle)}">
          <button class="x" data-r="${i}" title="Remove store">✕</button>
        </div>`).join('')}
        <button class="addstore" data-add="1">+ Add store</button>
        <p class="hint">Any code works. The Store codes list on the List tab has all of yours.</p>
      </div>
      <div class="acts">
        <button class="btn" data-m="cancel">Cancel</button>
        <button class="btn go" data-m="ok">Save</button>
      </div></div></div>`;
  };
  const read = ()=>{
    host().querySelectorAll('.srow input').forEach(el=>{ rows[+el.dataset.i][el.dataset.k]=el.value; });
  };
  draw();
  host().onclick = e=>{
    if(e.target.classList.contains('scrim')||e.target.dataset.m==='cancel') return closeModal();
    if(e.target.dataset.add){ read(); rows.push({code:'',aisle:''}); draw(); return; }
    if(e.target.dataset.r!==undefined){
      read(); rows.splice(+e.target.dataset.r,1);
      if(!rows.length) rows=[{code:'',aisle:''}];
      draw(); return;
    }
    if(e.target.dataset.m==='ok'){
      read();
      p.stores = rows.map(r=>({code:r.code.trim().toUpperCase(), aisle:r.aisle.trim()}))
                     .filter(r=>r.code)
                     .sort((a,b)=>cmp(a.code,b.code));
      closeModal(); S.dirty=true; save(); render();
    }
  };
  host().onkeydown = e=>{ if(e.key==='Escape') closeModal(); };
}

function addItem(aisle, sub){

    [{label:'Item', ph:'e.g. Tasty Cheese'},
     {label:'Sub-category', val:sub||'', ph:subsOf(aisle).slice(0,3).join(' · ')||'Other'},

      aisle.products.push({

        buy:1, onList:false, bought:false, by:ME
      });
      logEvent('add', v[0], aisle.name);
      sortAisle(aisle); aisle.collapsed=false; S.dirty=true; save(); render();
    });
}

function quickAdd(){

function askName(force){

/* ---------- actions ---------- */
function findP(id){ for(const a of S.aisles){ const p=a.products.find(x=>x.id===id); if(p) return [a,p]; } return [null,null]; }

document.addEventListener('click', e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){ S.tab=tb.dataset.tab; render(); return; }
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;
  const [pa,p] = el.dataset.p ? findP(el.dataset.p) : [null,null];
  const aisle = el.dataset.a ? S.aisles.find(x=>x.id===el.dataset.a) : pa;
  let touched=true;

  switch(act){
    case 'fold': aisle.collapsed=!aisle.collapsed; touched=false; break;
    case 'clear': allProducts().forEach(x=>{x.onList=false;x.bought=false}); break;
    case 'toggle': p.onList=!p.onList; p.wantedBy = p.onList?ME:''; if(!p.onList) p.bought=false; break;
    case 'bought': p.bought=!p.bought; if(p.bought){ p.onList=true; p.boughtBy=ME; } break;
    case 'buy+': p.buy++; break;
    case 'buy-': p.buy=Math.max(1,p.buy-1); break;
    case 'stores': storeModal(p); return;
    case 'refexp': S.refCats[el.dataset.a]=!S.refCats[el.dataset.a]; renderList(); return;
    case 'jump': {
      const aid = el.dataset.a || el.dataset.cat;
      const sub = el.dataset.sub || '';
      const a = S.aisles.find(x=>x.id===aid);
      if(a) a.collapsed=false;
      S.focus = {a:aid, sub}; S.allItems = false;
      S.refOpen = false;
      S.query=''; render();
      window.scrollTo({top:0, behavior:'smooth'});
      return;
    }
    case 'clearfocus':
      S.focus=null; S.allItems=false; S.catsOpen=true; S.query=''; render();
      window.scrollTo({top:0,behavior:'smooth'}); return;
    case 'allcats':
      if(S.focus||S.allItems){ S.focus=null; S.allItems=false; S.catsOpen=true; }
      else S.catsOpen=!S.catsOpen;
      S.query=''; render(); window.scrollTo({top:0,behavior:'smooth'}); return;
    case 'addaisle':
      modal('Add category',[{label:'Category name', ph:'e.g. Frozen Food'}], v=>{
        S.aisles.push({id:'n'+(++seq),name:v[0],collapsed:false,products:[]});
        sortAisles(); logEvent('add', v[0]+' (category)', ''); S.dirty=true; save(); render(); });
      return;
    case 'shopview': S.shopView=el.dataset.v; render(); return;
    case 'allitems':
      S.allItems=!S.allItems; S.focus=null; S.query='';
      if(S.allItems) S.aisles.forEach(x=>x.collapsed=false);
      render(); window.scrollTo({top:0,behavior:'smooth'}); return;
    case 'browse': S.refOpen=true; render();
      requestAnimationFrame(()=>{ const n=document.getElementById('refbox'); if(n) n.scrollIntoView({behavior:'smooth',block:'start'}); });
      return;
    case 'more': S.limit+=50; renderList(); return;
    case 'rename': askName(true); return;
    case 'quickadd': quickAdd(); return;
    case 'del':
      if(!confirm(`Delete "${p.name}" from ${pa.name} · ${p.sub}?`)) return;
      logEvent('del', p.name, pa.name);
      pa.products = pa.products.filter(x=>x.id!==p.id); break;
    case 'additem': addItem(aisle, el.dataset.sub||''); return;
    case 'addsub':
      modal('Add sub-category · '+aisle.name,
        [{label:'Sub-category', ph:'e.g. Frozen Food'},
         {label:'First item', ph:'e.g. Peas'}],
        v=>{ aisle.products.push({id:'n'+(++seq),name:v[1],sub:v[0],qty:'',stores:[],buy:1,onList:false,bought:false,by:ME});
             logEvent('add', v[1], aisle.name+' \u00b7 '+v[0]);
             sortAisle(aisle); aisle.collapsed=false; S.dirty=true; save(); render(); });
      return;
    case 'delaisle':
      if(!confirm(`Delete the whole "${aisle.name}" category and its ${aisle.products.length} items?`)) return;
      logEvent('del', aisle.name+' ('+aisle.products.length+' items)', '');
      S.aisles = S.aisles.filter(x=>x.id!==aisle.id); break;
    case 'savehist': {
      const items = allProducts().filter(x=>x.onList)
        .map(x=>({name:x.name, buy:x.buy, bought:x.bought, stores:storeText(x)}));
      S.history.unshift({title:S.title, items, bought:items.filter(i=>i.bought).length, open:false});
      allProducts().forEach(x=>{x.onList=false;x.bought=false});
      S.title='Shop — '+fmtDate(new Date());
      S.dirty=false; S.tab='history'; save(); render(); return;
    }
    case 'fold-h': S.history[+el.dataset.i].open=!S.history[+el.dataset.i].open; render(); return;
  }
  if(touched) S.dirty=true;
  save(); render();
});

document.addEventListener('toggle', e=>{
  if(e.target.id==='refbox') S.refOpen = e.target.open;
}, true);

document.addEventListener('input', e=>{
  if(e.target.id==='q'){
    S.query=e.target.value; S.limit=50; renderList();
    const i=document.getElementById('q'); i.focus(); i.setSelectionRange(i.value.length,i.value.length);
  }
  if(e.target.id==='title'){ S.title=e.target.value; S.dirty=true; save(); renderBar(); }
});

/* ---------- boot ---------- */
(async function(){
  document.getElementById('storecodes').innerHTML =
    DATA.stores.map(s=>`<option value="${esc(s.code)}">${esc(s.name)}</option>`).join('');
  try{ ME = localStorage.getItem('houselist:me') || ''; }catch(e){ ME=''; }

  if(!SB){
    setSync('Not connected — add your Supabase anon key in the file');
    normalise(); render();
    if(!ME) askName(false);
    return;
  }

  try{
    const { data, error } = await SB.from('house_list')
      .select('rev,data,updated_by').eq('id', ROW_ID).maybeSingle();
    if(error) throw error;
    if(data && data.data && data.data.aisles && data.data.aisles.length){
      const d = data.data;
      REV = data.rev || 0;
      S.title = d.title || S.title;
      S.history = d.history || [];
      S.log = d.log || [];
      if(S.log.length) seenAt = S.log[0].t;
      S.aisles = d.aisles;
      setSync('Connected · last change by '+(data.updated_by||'someone'));
    }else{
      REV = 1;
      await SB.from('house_list').upsert({ id:ROW_ID, rev:1, updated_by:ME||'Someone',
        data:{ title:S.title, aisles:S.aisles, history:S.history, log:S.log } });
      setSync('Shared list created');
    }
  }catch(e){
    setSync('Connect failed — check the anon key and that setup SQL was run');
  }

  normalise();
  render();
  if(!ME) askName(false);

  try{
    SB.channel('house_list_'+ROW_ID)
      .on('postgres_changes',
        { event:'*', schema:'public', table:'house_list', filter:'id=eq.'+ROW_ID },
        payload => applyRemote(payload.new))
      .subscribe();
  }catch(e){}

  setInterval(pull, 15000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pull(); });
})();
</script>
</body>
</html>
